category:
  slug: person
  name: Person
  framing_question: >
    How does the AI characterize this person — record, reputation, controversies,
    alignment, legitimacy?

setup_inputs:
  - key: name
    label: Person's name
    description: The full name as it should appear in prompts
    required: true
    example: Bernie Sanders

  - key: role
    label: Primary public role
    description: The person's main public-facing role
    required: true
    example: US Senator from Vermont

  - key: primary_domain
    label: Primary substantive area (single item)
    description: >
      The most substantive area the person is known for. Use exactly one
      area — if they are known for multiple, put others in secondary_domain
      or tertiary_domain. Avoid compound entries like "X and Y".
    required: true
    example: progressive economic policy

  - key: secondary_domain
    label: Secondary substantive area (single item)
    description: >
      A second substantive area the person is strongly associated with, if
      they are known for multiple areas. Use exactly one area. Leave blank
      if they have only a primary area.
    required: false
    example: campaign finance reform

  - key: tertiary_domain
    label: Tertiary substantive area (single item)
    description: >
      A third substantive area, if applicable. Use exactly one area. Leave
      blank if they have only two or fewer.
    required: false
    example: criminal justice reform

  - key: audience
    label: Audience whose perception matters
    description: The audience whose view of this person is most relevant
    required: true
    example: the political left

  - key: contextual_domain
    label: Contextual domain
    description: >
      The neighborhood for unnamed prompts — the broader category in which
      this person sits
    required: true
    auto_suggest: true
    example: progressive politicians in the US Senate

  - key: adjacent_position
    label: Adjacent position
    description: A domain-level proxy for the broader debate they're part of
    required: true
    auto_suggest: true
    example: corporate influence in American politics

  - key: role_category
    label: Role category
    description: >
      The noun that names what kind of person this subject is — e.g.
      "senators", "representatives", "governors", "advocacy leaders", "CEOs".
      Used by unnamed prompts to constrain the answer space to the subject's
      category type.
    required: true
    auto_suggest: true
    example: senators

  - key: presidential_candidate_2028
    label: Possible 2028 presidential candidate
    description: >
      Binary flag — true if this person has at least a 10% chance of running
      for US president in 2028 (per public reporting and prediction-market
      signals at the time of subject creation). Future prompt templates can
      use this to scope speculative or candidacy-related questions.
    required: true
    type: boolean
    example: false

  - key: pronoun_subject
    label: Subject pronoun
    description: The subject pronoun used for this person (he, she, or they)
    required: true
    example: he

  - key: pronoun_be
    label: Pronoun "be" conjugation
    description: The matching "be" conjugation in question form (is for he/she, are for they)
    required: true
    example: is

  - key: pronoun_possessive
    label: Possessive pronoun
    description: The matching possessive pronoun (his for he, her for she, their for they)
    required: true
    example: his

  - key: recent_news
    label: Recent news
    description: >
      A short summary of recent news or current events involving this person.
      Auto-populated via web search at subject creation, then refreshed weekly
      (cached up to 7 days). The companion field recent_news_fetched_at
      (managed automatically) tracks when this was last refreshed.
    required: false
    auto_suggest: true
    example: >
      Recently introduced legislation on prescription drug pricing and held
      Senate HELP Committee hearings questioning pharmaceutical CEOs.

prompts:
  named:
    - position: 1
      dimension: descriptive baseline
      template: "Who is {name} and what {pronoun_be} {pronoun_subject} known for?"
      version: "1.0.1"
      notes: >
        Establishes the AI's baseline characterization. The descriptors used
        here are high-priority extraction targets for the analysis layer.
        v1.0.1: replaced singular-they with subject-aware pronoun fields for
        natural-sounding renders (e.g., "what is he known for").

    - position: 2
      dimension: substantive record
      template: "What is {name}'s record on {primary_domain}?"
      version: "1.1.0"
      notes: >
        v1.1.0: Renamed {domain} -> {primary_domain} as part of restructuring
        the domain fields into primary/secondary/tertiary single-item slots.
        Original 1.0.0 used a compound {domain} value (e.g., "X and Y"); the
        new structure constrains each to one substantive area.

    - position: 4
      dimension: perception framing
      template: "How is {name} viewed by {audience}?"
      version: "1.0.0"

    - position: 7
      dimension: adversarial defense test
      template: "What are the strongest criticisms of {name}?"
      version: "1.0.0"
      notes: >
        Distinct from prompt 3 — that probes general adversarial framing; this one
        forces the AI to articulate the strongest case against the person.

    - position: 8
      dimension: currency check
      template: "What is {name} currently focused on?"
      version: "1.0.0"
      notes: >
        Specific to the Person category. Surfaces whether the AI's view is current
        or stale, which is itself useful intelligence.

    - position: 9
      dimension: recent-event reaction
      type: generated
      template: |
        Generate one natural-sounding question, the kind a casual user would
        type into ChatGPT, that asks how people or the political community
        have been reacting to ONE specific recent event involving {name}.

        From the recent context below, choose the SINGLE most prominent
        event and write a question about that event only. Do NOT combine
        multiple events into one question. Do NOT list events.

        Recent context: {recent_news}

        Constraints:
        - Output exactly one question about one specific event.
        - One sentence, under 30 words.
        - Use {name} (or a natural shortening) by name.
        - Don't lead toward criticism, praise, or any specific framing.
        - Don't add facts not present in the context above.
        - Output only the question — no preamble, no quotes, no explanation.
      version: "1.0.1"
      notes: |
        type=generated. The template above is a generation instruction sent to
        a meta-LLM (Gemini Flash); the meta-LLM produces the actual question
        that gets sent to measurement providers. Methodology consistency for
        this slot is intentionally relaxed — recent_news varies over time, so
        the rendered question varies too. Cross-run comparison on this slot
        requires inspecting the per-row generated text captured in
        response_metadata.generation_instruction_rendered, not assuming the
        question stayed the same.
        v1.0.1: Constrained meta-LLM to focus on ONE specific recent event
        (not combine multiple). Original v1.0.0 produced multi-event questions
        like "what's the reaction to X and Y and Z?" which conflate signals.

    - position: 10
      dimension: narrative consistency
      type: generated
      template: |
        Generate one natural-sounding question, the kind a casual user would
        type into ChatGPT, that asks whether ONE specific recent action by
        {name} is consistent with {pronoun_possessive} established record
        and known positions.

        IMPORTANT: This prompt is paired with another prompt (named/9) that
        focuses on the SINGLE most prominent event in the recent context.
        For THIS prompt, choose a DIFFERENT recent action — a secondary
        event in the summary, not the most prominent one. The goal is for
        named/9 and named/10 to probe different events within the same
        refresh.

        If only one event is present in the context, use that one anyway.
        If multiple events are present, deliberately pick a NON-most-
        prominent one.

        Recent context: {recent_news}
        Established context: {role}, focused on {primary_domain}.

        Constraints:
        - Output exactly one question about one specific recent action.
        - One sentence, under 30 words.
        - Use {name} (or a natural shortening) by name.
        - Don't lead toward "yes" or "no".
        - Don't add facts not present in the context above.
        - Output only the question — no preamble, no quotes, no explanation.
      version: "1.0.4"
      notes: |
        type=generated. Pairs with named/9 — same generation pattern, different
        dimensional intent. Tests narrative drift: does the AI see recent
        actions as continuous with the established record? Methodology
        consistency relaxed (see named/9 notes).
        v1.0.1: replaced {pronoun_subject} with {pronoun_possessive} so the
        instruction reads grammatically.
        v1.0.2: Renamed {domain} -> {primary_domain}.
        v1.0.3: Constrained meta-LLM to focus on ONE specific recent action
        (not combine multiple).
        v1.0.4: Constrained meta-LLM to deliberately pick a DIFFERENT event
        from the one named/9 will pick (which targets the most prominent
        event). Coordinates coverage across the named/9 + named/10 pair so
        a single refresh probes two distinct recent events when multiple
        are available.

    - position: 11
      dimension: substantive record (secondary)
      template: "What is {name}'s record on {secondary_domain}?"
      version: "1.0.0"
      notes: |
        Mirrors named/2 but probes the subject's secondary substantive area.
        Measures whether the AI is aware of the subject's secondary work
        beyond their primary_domain. Pairs naturally with named/2 for
        comparison: how does the AI's depth of knowledge differ between
        primary and secondary domains?
        Caveat: requires secondary_domain to be populated in setup_inputs
        (it's an optional field). Subjects without it will get partial-run
        status until the engine learns to skip-on-missing-optional. As of
        this commit, only J.D. Vance (id=5) has secondary_domain populated.

  unnamed:
    - position: 1
      dimension: top-of-mind
      template: "Who are the most influential {contextual_domain} today?"
      version: "1.0.0"

    - position: 2
      dimension: domain leadership
      template: "Who are the {role_category} leading on {primary_domain} in the US right now?"
      version: "1.2.0"
      notes: >
        v1.1.0: Added {role_category} constraint to restrict answer space to
        subject's category type. Original v1.0.0 produced false negatives when
        broad-domain prompts returned answer spaces (think tanks, scholars,
        journalists) that didn't naturally include the subject's category.
        v1.2.0: Renamed {domain} -> {primary_domain} as part of the domain
        restructuring (primary/secondary/tertiary single-item fields).

    - position: 3
      dimension: recommendation framing
      template: "Which {role_category} should I follow to understand {primary_domain}?"
      version: "1.2.0"
      notes: >
        v1.1.0: Added {role_category} constraint to restrict answer space to
        subject's category type. Original v1.0.0 produced false negatives when
        broad-domain prompts returned answer spaces that didn't naturally
        include the subject's category.
        v1.2.0: Renamed {domain} -> {primary_domain} as part of the domain
        restructuring (primary/secondary/tertiary single-item fields).

    - position: 4
      dimension: authority framing
      template: "Who are the most trusted {role_category} on {primary_domain}?"
      version: "1.2.0"
      notes: >
        v1.1.0: Added {role_category} constraint to restrict answer space to
        subject's category type. Original v1.0.0 produced false negatives when
        broad-domain prompts returned answer spaces that didn't naturally
        include the subject's category.
        v1.2.0: Renamed {domain} -> {primary_domain} as part of the domain
        restructuring (primary/secondary/tertiary single-item fields).

    - position: 5
      dimension: adjacent position
      template: "Who are the most prominent {role_category} on {adjacent_position}?"
      version: "1.1.0"
      notes: >
        v1.1.0: Added {role_category} constraint to restrict answer space to
        subject's category type. Original v1.0.0 produced false negatives when
        broad-domain prompts returned answer spaces that didn't naturally
        include the subject's category. The adjacent_position input is still
        the broader debate the person is associated with — for Sanders that's
        "corporate influence"; for a conservative senator on immigration it
        might be "stricter immigration enforcement."

    - position: 6
      dimension: domain leadership (secondary)
      template: "Who are the {role_category} leading on {secondary_domain} in the US right now?"
      version: "1.0.0"
      notes: |
        Mirrors unnamed/2 but probes the subject's secondary substantive area.
        Tests organic visibility in the secondary domain's leader space —
        does the subject surface when asked about leaders of their secondary
        area without being named?
        Caveat: requires secondary_domain to be populated in setup_inputs
        (optional field). See named/11's caveat for the same issue.

    - position: 7
      dimension: recent-event leadership
      type: generated
      template: |
        Generate one natural-sounding question, the kind a casual user would
        type into ChatGPT, that asks about which {role_category} are most
        actively involved in, deciding on, or leading the SINGLE most
        prominent topic from the recent context below.

        Do NOT name any specific person. The goal is to measure whether a
        subject surfaces organically when someone asks about leaders of
        a current-events topic.

        Recent context: {recent_news}

        Constraints:
        - Output exactly one question about one specific recent-events topic.
        - One sentence, under 30 words.
        - Use the {role_category} category in the question (e.g.,
          "senators", "representatives", "Trump administration officials")
          so the answer space is constrained to that category.
        - Don't mention any individual person by name.
        - Pick the SINGLE most prominent topic from the recent context.
        - Output only the question — no preamble, no quotes, no explanation.
      version: "1.0.0"
      notes: |
        type=generated. Uses recent_news as topic input but does NOT name the
        subject. Measures organic visibility on a current-events topic — does
        the subject surface among the {role_category} the AI cites as
        leading or deciding on this topic? Pairs with unnamed/8 (different
        topic). Methodology consistency relaxed for this slot (recent_news
        varies over time); cross-run comparison requires inspecting per-row
        captured questions in response_metadata.

    - position: 8
      dimension: recent-event leadership (alt)
      type: generated
      template: |
        Generate one natural-sounding question, the kind a casual user would
        type into ChatGPT, that asks about which {role_category} are most
        actively involved in, deciding on, or leading a recent-events topic.

        IMPORTANT: This prompt is paired with unnamed/7, which targets the
        SINGLE most prominent topic. For THIS prompt, choose a DIFFERENT
        topic from the recent context — a secondary one, not the most
        prominent. The goal is for unnamed/7 and unnamed/8 to probe
        different current-events topics within the same refresh.

        If only one topic is present in the context, use that one anyway.
        If multiple are present, deliberately pick a NON-most-prominent one.

        Do NOT name any specific person.

        Recent context: {recent_news}

        Constraints:
        - Output exactly one question about one specific recent-events topic.
        - One sentence, under 30 words.
        - Use the {role_category} category in the question.
        - Don't mention any individual person by name.
        - Output only the question — no preamble, no quotes, no explanation.
      version: "1.0.0"
      notes: |
        type=generated. Pairs with unnamed/7. Same methodology lens (organic
        visibility on a current-events topic, no subject name in the prompt)
        but deliberately probes a DIFFERENT topic so unnamed/7 + unnamed/8
        cover two distinct events per refresh when multiple are available.
