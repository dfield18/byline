[project]
name = "byline"
version = "0.1.0"
description = "AI search visibility tooling — prompt-running infrastructure"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary,pool]>=3.2",
    "openai>=1.50",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.30",
    "pandas>=2.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-jose[cryptography]>=3.3",  # JWT validation (Clerk integration later)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
